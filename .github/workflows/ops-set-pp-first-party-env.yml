name: Ops set PP first-party env

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-env:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Upsert PP_FIRST_PARTY_FETCH_SECRET on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SECRET: ${{ secrets.PP_FIRST_PARTY_FETCH_SECRET }}
        run: node scripts/ops-set-pp-first-party-env-gha.mjs
